services:
  guardian:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/guardian.db
      TELEGRAM_SESSION_PATH: /data/mtproto/admin
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - guardian-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  guardian-data:
