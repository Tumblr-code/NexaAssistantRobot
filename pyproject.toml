[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nexa-guardian"
version = "0.6.8"
description = "A self-hosted Telegram group moderation bot for spam deletion and member restrictions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "aiohttp==3.14.3",
  "multidict==6.9.1",
  "aiogram==3.31.0",
  "aiosqlite==0.22.1",
  "python-dotenv==1.2.3",
  "Telethon==1.44.0",
]

[project.urls]
Repository = "https://github.com/Tumblr-code/NexaAssistantRobot"

[project.optional-dependencies]
dev = [
  "pip-audit==2.9.0",
  "pyright==1.1.403",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==6.2.1",
  "ruff==0.16.4",
]

[project.scripts]
nexa-guardian = "nexa_guardian.main:main"
nexa-guardian-probe = "nexa_guardian.gateway_probe:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexa_guardian"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
