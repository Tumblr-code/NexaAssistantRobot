[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nexa-guardian"
version = "0.1.0"
description = "A self-hosted Telegram group moderation bot for spam deletion and member restrictions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "aiogram==3.31.0",
  "aiosqlite==0.22.1",
  "python-dotenv==1.2.3",
]

[project.urls]
Repository = "https://github.com/Tumblr-code/NexaAssistantRobot"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.4",
]

[project.scripts]
nexa-guardian = "nexa_guardian.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexa_guardian"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]
